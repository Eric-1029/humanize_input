[package]
name = "humanize-desktop"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
ashpd = { version = "0.14.3", default-features = false, features = ["tokio", "global_shortcuts"] }
async-channel = "2.5.0"
futures-util = "0.3.34"
humanize-core = { path = "../core", features = ["serde"] }
humanize-keymap = { path = "../keymap" }
ksni = "0.3.7"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "1.2.2"
zbus = { version = "6.5.0", default-features = false, features = ["tokio"] }

[lints]
workspace = true

[dev-dependencies]
zbus = { version = "6.5.0", default-features = false, features = ["tokio", "p2p"] }
